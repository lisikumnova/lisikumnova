<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Website Builder | Lisi Kumnova</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#070a0f;
  color:#fff;
}

header{
  padding:20px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #202731;
  background:#090d13;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.back{
  color:#fff;
  text-decoration:none;
  opacity:.85;
}

.back:hover{
  opacity:1;
}

main{
  max-width:1250px;
  margin:auto;
  padding:40px 20px;
}

.hero{
  text-align:center;
  margin-bottom:35px;
}

.hero h1{
  font-size:clamp(32px,5vw,52px);
  margin:0 0 12px;
}

.hero p{
  color:#aab4c0;
  font-size:17px;
  margin:0;
}

.builder{
  display:grid;
  grid-template-columns:370px 1fr;
  gap:22px;
}

.panel,
.preview{
  background:#10161e;
  border:1px solid #27313c;
  border-radius:18px;
  padding:22px;
}

label{
  display:block;
  margin:16px 0 8px;
  font-weight:700;
}

textarea,
input,
select{
  width:100%;
  background:#080d13;
  color:#fff;
  border:1px solid #34404d;
  border-radius:11px;
  padding:13px;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:155px;
  resize:vertical;
}

textarea:focus,
select:focus{
  border-color:#7c3aed;
}

input[type="color"]{
  height:50px;
  padding:5px;
  cursor:pointer;
}

button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:15px;
  margin-top:16px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  background:#fff;
  color:#080b0f;
  transition:.2s;
}

button:hover{
  opacity:.9;
  transform:translateY(-1px);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

button.secondary{
  background:#202a35;
  color:#fff;
}

.status{
  font-size:13px;
  color:#9ba7b5;
  margin-top:13px;
  min-height:20px;
  line-height:1.5;
}

.tip{
  font-size:13px;
  color:#7f8b99;
  line-height:1.5;
  margin-top:14px;
}

.preview h2{
  margin-top:0;
  margin-bottom:15px;
}

.preview-box{
  position:relative;
}

iframe{
  width:100%;
  height:650px;
  border:1px solid #303b47;
  border-radius:12px;
  background:#fff;
}

.loading{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(7,10,15,.75);
  border-radius:12px;
  z-index:5;
}

.loading.active{
  display:flex;
}

.loading-box{
  background:#111820;
  border:1px solid #34404d;
  padding:22px 28px;
  border-radius:14px;
  text-align:center;
}

.spinner{
  width:30px;
  height:30px;
  border:3px solid #394553;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:850px){

  .builder{
    grid-template-columns:1fr;
  }

  iframe{
    height:570px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    Lisi Kumnova AI
  </div>

  <a class="back" href="index.html">
    ← Kthehu
  </a>

</header>


<main>

<section class="hero">

  <h1>
    Krijo website-in tënd me AI 🤖
  </h1>

  <p>
    Shkruaj çfarë website-i dëshiron dhe AI do ta krijojë dizajnin për ty.
  </p>

</section>


<section class="builder">

  <div class="panel">

    <label for="idea">
      Çfarë website-i dëshiron?
    </label>

    <textarea
      id="idea"
      placeholder="Shembull: Dua një website modern për një berberhane me ngjyra të zeza dhe ari, Home, Services, Gallery, About dhe Contact."
    ></textarea>


    <label for="style">
      Stili
    </label>

    <select id="style">

      <option>Modern</option>
      <option>Minimal</option>
      <option>Luxury</option>
      <option>Gaming</option>
      <option>Business</option>
      <option>Creative</option>

    </select>


    <label for="color">
      Ngjyra kryesore
    </label>

    <input
      id="color"
      type="color"
      value="#7c3aed"
    >


    <button
      id="generateBtn"
      onclick="buildPreview()"
    >
      ✨ Krijo dizajnin me AI
    </button>


    <button
      class="secondary"
      onclick="resetPreview()"
    >
      Pastro
    </button>


    <div
      class="status"
      id="status"
    >
      Gati për të krijuar website-in.
    </div>


    <div class="tip">

      💡 Përshkruaje sa më qartë biznesin,
      ngjyrat, seksionet dhe funksionet që dëshiron.

    </div>

  </div>


  <div class="preview">

    <h2>
      Live Preview
    </h2>

    <div class="preview-box">

      <div
        class="loading"
        id="loading"
      >

        <div class="loading-box">

          <div class="spinner"></div>

          <div>
            AI po krijon website-in...
          </div>

        </div>

      </div>


      <iframe
        id="preview"
        title="AI Website Preview"
      ></iframe>

    </div>

  </div>

</section>

</main>


<script>

/* =====================================================
   AI WEBSITE BUILDER
===================================================== */

async function buildPreview(){

  const idea =
    document.getElementById("idea").value.trim();

  const style =
    document.getElementById("style").value;

  const color =
    document.getElementById("color").value;

  const status =
    document.getElementById("status");

  const preview =
    document.getElementById("preview");

  const button =
    document.getElementById("generateBtn");

  const loading =
    document.getElementById("loading");


  if(!idea){

    status.textContent =
      "⚠️ Shkruaj fillimisht çfarë website-i dëshiron.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "⏳ AI po krijon...";

  loading.classList.add("active");

  status.textContent =
    "AI po krijon dizajnin...";


  try{

    /*
      KËTU PËRDORET URL-JA DIREKTE E BACKEND-IT
    */

    const response = await fetch(
      "https://lisikumnovaai.vercel.app/api/chat",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          prompt:`

Ti je një web designer dhe developer profesionist.

Krijo një website komplet HTML për këtë klient:

${idea}

Stili:
${style}

Ngjyra kryesore:
${color}

KËRKESA:

- Krijo website profesional.
- Responsive për telefon, tablet dhe PC.
- Krijo navigation menu.
- Krijo Hero Section.
- Krijo About Section.
- Krijo Services Section.
- Krijo Gallery nëse është e përshtatshme.
- Krijo Pricing nëse është e përshtatshme.
- Krijo Contact Section.
- Krijo butona modernë.
- Përdor animacione të lehta.
- Përdor ngjyrën ${color}.
- Dizajni duhet të duket profesional dhe modern.
- HTML, CSS dhe JavaScript duhet të jenë në një dokument.
- Mos përdor libra të jashtëm.
- Mos jep shpjegime.
- Mos përdor Markdown.
- Kthe vetëm kodin komplet HTML.
- Fillojë direkt me <!DOCTYPE html>.

Krijo dizajnin sa më profesional që mundesh.

`

        })

      }

    );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Gabim nga backend/API."
      );

    }


    let html =
      data.result || "";


    /*
      Heqim ```html nëse AI e kthen
    */

    html =
      html
      .replace(/^```html\s*/i,"")
      .replace(/^```\s*/i,"")
      .replace(/\s*```$/i,"")
      .trim();


    if(!html){

      throw new Error(
        "AI nuk ktheu HTML."
      );

    }


    /*
      SHFAQ WEBSITE-IN
    */

    preview.srcdoc =
      html;


    status.textContent =
      "✅ Website u krijua me sukses nga AI!";


  }

  catch(error){

    console.error(error);

    status.textContent =
      "❌ Gabim: " +
      error.message;


    preview.srcdoc = `

      <!DOCTYPE html>

      <html>

      <body style="
        font-family:Arial;
        padding:40px;
        color:#222;
      ">

        <h2>Ndodhi një gabim</h2>

        <p>
          ${escapeHtml(error.message)}
        </p>

      </body>

      </html>

    `;

  }


  finally{

    button.disabled = false;

    button.textContent =
      "✨ Krijo dizajnin me AI";

    loading.classList.remove("active");

  }

}


/* =====================================================
   RESET
===================================================== */

function resetPreview(){

  document.getElementById("idea").value = "";

  document.getElementById("preview").srcdoc = "";

  document.getElementById("status").textContent =
    "Gati për të krijuar website-in.";

}


/* =====================================================
   ESCAPE ERROR TEXT
===================================================== */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   INITIAL PREVIEW
===================================================== */

window.addEventListener("load",function(){

  document.getElementById("preview").srcdoc = `

    <!DOCTYPE html>

    <html>

    <head>

      <meta charset="UTF-8">

      <style>

        body{
          margin:0;
          font-family:Arial;
          background:#0b0f15;
          color:white;
          display:flex;
          align-items:center;
          justify-content:center;
          min-height:100vh;
          text-align:center;
        }

        .box{
          max-width:600px;
          padding:40px;
        }

        h1{
          font-size:42px;
          margin-bottom:15px;
        }

        p{
          color:#aeb6c2;
          line-height:1.6;
        }

      </style>

    </head>

    <body>

      <div class="box">

        <h1>🤖 AI Website Builder</h1>

        <p>
          Shkruaj kërkesën në anën e majtë
          dhe kliko
          <b>Krijo dizajnin me AI</b>.
        </p>

      </div>

    </body>

    </html>

  `;

});

</script>

</body>
</html>
