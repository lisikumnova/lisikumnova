            class="message">

    <!-- =====================================================
         ADMIN PANEL

    <div
        id="adminPanel"

        <!-- =================================================

                accept="image/*"

<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://mbzbxfjxfckovguzftdk.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_2PgPd268AABb6DMFXVno_A_hr5tz83V";


const BUCKET_NAME =
    "projects";


let accessToken = null;



/* =========================================================
   LOGIN
========================================================= */

async function login() {


    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    if (!email || !password) {

        document
        .getElementById("loginMessage")
        .textContent =
            "Shkruaj email-in dhe password-in.";

        return;
    }


    try {


        const response =
            await fetch(

                SUPABASE_URL +
                "/auth/v1/token?grant_type=password",

                {

                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            password:
                                password

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            document
            .getElementById(
                "loginMessage"
            )
            .textContent =

                data.error_description ||
                data.msg ||
                "Login nuk u krye.";

            return;
        }


        accessToken =
            data.access_token;


        document
        .getElementById(
            "loginBox"
        )
        .classList
        .add("hidden");


        document
        .getElementById(
            "adminPanel"
        )
        .classList
        .remove("hidden");


        document
        .getElementById(
            "loginMessage"
        )
        .textContent = "";


        loadProjects();


    } catch (error) {


        console.error(error);


        document
        .getElementById(
            "loginMessage"
        )
        .textContent =
            "Gabim gjatë lidhjes me Supabase.";

    }

}



/* =========================================================
   LOGOUT
========================================================= */

function logout() {


    accessToken = null;


    document
    .getElementById(
        "adminPanel"
    )
    .classList
    .add("hidden");


    document
    .getElementById(
        "loginBox"
    )
    .classList
    .remove("hidden");

}



/* =========================================================
   FILE NAME
========================================================= */

function showFileName() {


    const fileInput =
        document
        .getElementById(
            "projectImage"
        );


    const fileName =
        document
        .getElementById(
            "fileName"
        );


    if (
        fileInput.files &&
        fileInput.files.length > 0
    ) {

        fileName.textContent =
            "Fotoja: " +
            fileInput.files[0].name;

    } else {

        fileName.textContent =
            "Asnjë foto nuk është zgjedhur.";

    }

}



/* =========================================================
   UPLOAD IMAGE
========================================================= */

async function uploadImage(file) {


    if (!file) {

        return null;
    }


    const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2) +
        "." +
        extension;


    const filePath =
        fileName;


    const response =
        await fetch(

            SUPABASE_URL +
            "/storage/v1/object/" +
            BUCKET_NAME +
            "/" +
            filePath,

            {

                method: "POST",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        file.type,

                    "x-upsert":
                        "false"

                },

                body:
                    file

            }

        );


    const data =
        await response.json();


    if (!response.ok) {

        console.error(
            "Storage error:",
            data
        );


        throw new Error(

            data.message ||
            data.error ||
            "Fotoja nuk u ngarkua."

        );

    }


    const publicUrl =
        SUPABASE_URL +
        "/storage/v1/object/public/" +
        BUCKET_NAME +
        "/" +
        filePath;


    return publicUrl;

}



/* =========================================================
   ADD PROJECT
========================================================= */

async function addProject() {


    const title =
        document
        .getElementById("title")
        .value
        .trim();


    const description =
        document
        .getElementById("description")
        .value
        .trim();


    const imageInput =
        document
        .getElementById("projectImage");


    const file =
        imageInput.files[0];


    const message =
        document
        .getElementById("message");


    if (!title || !description) {

        message.textContent =
            "Plotëso titullin dhe përshkrimin.";

        return;
    }


    try {


        message.textContent =
            "Duke ngarkuar projektin...";


        /* ================================================
           1. UPLOAD FOTO
        ================================================ */


        let imageUrl = null;


        if (file) {

            message.textContent =
                "Duke ngarkuar foton...";


            imageUrl =
                await uploadImage(file);

        }


        /* ================================================
           2. INSERT PROJECT
        ================================================ */


        message.textContent =
            "Duke ruajtur projektin...";


        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/projects",

                {

                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=representation"

                    },

                    body:
                        JSON.stringify({

                            title:
                                title,

                            description:
                                description,

                            image_url:
                                imageUrl

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            console.error(data);


            message.textContent =
                "Gabim: " +
                (
                    data.message ||
                    data.error_description ||
                    data.hint ||
                    "Nuk u shtua projekti."
                );

            return;
        }


        /* ================================================
           3. RESET FORM
        ================================================ */


        document
        .getElementById("title")
        .value = "";


        document
        .getElementById("description")
        .value = "";


        document
        .getElementById("projectImage")
        .value = "";


        document
        .getElementById("fileName")
        .textContent =
            "Asnjë foto nuk është zgjedhur.";


        message.textContent =
            "Projekti dhe fotografia u shtuan me sukses ✓";


        loadProjects();


    } catch (error) {


        console.error(error);


        message.textContent =
            "Gabim: " +
            error.message;

    }

}



/* =========================================================
   LOAD PROJECTS
========================================================= */

async function loadProjects() {


    const container =
        document
        .getElementById(
            "projects"
        );


    try {


        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/projects?select=*&order=created_at.desc",

                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY

                    }

                }

            );


        const data =
            await response.json();


        if (
            !Array.isArray(data) ||
            data.length === 0
        ) {

            container.innerHTML =
                "<p style='color:#777'>Nuk ka ende projekte.</p>";

            return;
        }


        container.innerHTML =

            data
            .map(

                project => `

                    <div class="project">


                        <h3>
                            ${escapeHtml(
                                project.title
                            )}
                        </h3>


                        <p>
                            ${escapeHtml(
                                project.description
                            )}
                        </p>


                        ${
                            project.image_url

                            ?

                            `
                            <img
                                src="${escapeHtml(
                                    project.image_url
                                )}"
                                class="project-image"
                                alt="${escapeHtml(
                                    project.title
                                )}"
                            >
                            `

                            :

                            ""
                        }


                    </div>

                `

            )
            .join("");



    } catch (error) {


        console.error(error);


        container.innerHTML =
            "<p style='color:#f66'>Nuk u ngarkuan projektet.</p>";

    }

}



/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(text) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text || "";


    return div.innerHTML;

}

</script>


</body>

</html>
